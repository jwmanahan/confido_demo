version: 2

models:
  - name: int_invoice
    description: |
      * Normalized information we know about an invoice. Meant for usage in the mart layer
      * All values are pre-refund
    columns:
      - name: invoice_id
        description: Confido-internal identifier of the invoice
        data_tests:
          - unique
          - not_null
      - name: company_id
        description: Confido-internal identifier of the company this invoice is related to (paid by? issued by?)
      - name: customer_remote_id
        description: |
          * An identifier in external systems of the global customer related to this invoice (issued by? paid by?)
          * The Confido-internal global_customer_id is not available as of Sept 2026 for invoices
      - name: subsidiary_id
        description: Confido-interal identifier of the subsidiary, which is a m:m pathway to contact
      - name: invoice_number
        description: String identifier of the invoice. Not guaranteed to be unique, but is how external partners will identify the invoice
      - name: invoice_state
        description: Paid or open
      - name: invoice_created_at_ntz
        description: |
            * Our best knowledge on when the invoice was first created
            * Note the datatype of no time zone, especially if you're running this code outside US Eastern Time and on Daylight Savings Time
      - name: paid_on_date
        description: If the invoice has been paid, this is the date (no timestamp). Not sure if this is first payment, final payment, funds committed, funds cleared, or what
      - name: invoice_original_total_price
        description: The sum of the prices printed on this invoice's line items, excluding negative charges
      - name: currency
        description: ISO-3 currency code, or empty, which is presumed to be USD
      - name: n_original_invoice_items
        description: The number of line items on this invoice before any refunds
      - name: invoice_original_total_quantity
        description: An alternate measure of volume to price, beware of comparing quantities of different types of products
