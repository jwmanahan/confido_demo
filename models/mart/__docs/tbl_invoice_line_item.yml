version: 2

models:
  - name: tbl_invoice_line_item
    description: Everything data consumers want to know at an invoice line item granularity
    columns:
      - name: invoice_item_id
        description: Confido-internal identifier of the invoice line item
        data_tests:
          - unique
          - not_null
        config:
          meta:
            is_primary_key: true
      - name: invoice_id
        description: Confido-internal identifier of the invoice
        data_tests:
          - not_null
      - name: invoice_number
        description: String identifier of the invoice. Not guaranteed to be unique, but is how external partners will identify the invoice
      - name: invoice_currency
        description: Limited for now to USD and empty, which is presumed to be USD
      - name: price_on_invoice_item
        description: The price printed on this invoice line item, even if negative
      - name: pct_of_invoice_price
        description: |
          * The percentage of the whole invoice price held by this line item
          * Beware that percentages of invoices with both positive and negative charge directions are percent of the net price and can thus be negative and >100%
      - name: charge_direction
        description: Whether this line item represents a payment "Positive charge" or a refund of any sort "Negative charge". Both directions can exist on the same invoice
      - name: unit_quantity
        description: The number of things being sold on this line item
      - name: unit_price
        description: The listed price for each thing being sold
      - name: price_implied_by_price_x_quantity
        description: |
          * Simply unit_price times unit_quantity
          * Always within $10 of the more accurate price_on_invoice_item
          * Differences are assumed to be due to rounding and possibly small fees
      - name: invoice_state
        description: Paid or open
      - name: invoice_created_at_ntz
        description: |
          * Our best knowledge on when the invoice was first created
          * Note the datatype of no time zone, especially if you're running this code outside US Eastern Time and on Daylight Savings Time
      - name: paid_on_date
        description: If the invoice has been paid, this is the date (no timestamp). Not sure if this is first payment, final payment, funds committed, funds cleared, or what
      - name: item_id
        description: Confido-internal identifier of the item that this invoice line item is selling
      - name: item_remote_id
        description: Item/product identifier used by the company transacting the item on this invoice line items.
      - name: item_name
        description: The name of the thing being sold on this invoice line item
      - name: company_id
        description: Confido-internal identifier of the company this invoice is related to (paid by? issued by?)
      - name: company_name
        description: The current name of the company this invoice is related to, here for readability
      - name: muffin_organization_id
        description: The ID of the organization that the company related to this invoice belongs, if applicable
      - name: table_last_generated_at
        description: Processing data. When the data you're looking at was last refreshed
